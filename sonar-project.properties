sonar.projectKey=kmjayadeep_baskit
sonar.organization=kmjayadeep
sonar.sourceEncoding=UTF-8

# Flutter/Dart and autonomous-agent TypeScript source and test locations
sonar.sources=app/lib,automation/autonomous-agent/src
sonar.tests=app/test,automation/autonomous-agent/test

# Exclusions for generated and build output files
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.mocks.dart,**/generated/**,**/build/**,**/coverage/**,**/dist/**,**/.dart_tool/**,**/node_modules/**

# Coverage generated by Flutter and Vitest
sonar.dart.lcov.reportPaths=app/coverage/lcov.info
sonar.javascript.lcov.reportPaths=automation/autonomous-agent/coverage/lcov.info
