schemaVersion: 1
baseBranch: main
branchPrefix: agent/
localStateDirectory: .agent-state
roles:
  explorer:
    model: openai-codex/gpt-5.6-luna
    reasoning: medium
  planner:
    model: openai-codex/gpt-5.6-luna
    reasoning: high
  planReviewer:
    model: openai-codex/gpt-5.6-terra
    reasoning: high
  implementer:
    model: openai-codex/gpt-5.6-luna
    reasoning: high
  codeReviewer:
    model: openai-codex/gpt-5.6-sol
    reasoning: high
  documentation:
    model: openai-codex/gpt-5.6-luna
    reasoning: medium
  governanceReviewer:
    model: openai-codex/gpt-5.6-terra
    reasoning: high
limits:
  planReviewIterations: 2
  implementationReviewIterations: 3
  governanceReviewIterations: 2
  maxAgentTurnsPerStage: 40
  maxReviewerTurnsPerStage: 8
  maxAgentToolCallsPerStage: 80
  maxExplorerToolCallsPerStage: 12
  maxPlannerToolCallsPerStage: 20
  maxReviewerToolCallsPerStage: 4
  stageTimeoutMinutes: 25
  totalRuntimeMinutes: 120
  maxTotalTokens: 1000000
  maxArtifactBytes: 256000
  maxRunBytes: 5000000
validation:
  extraCommands: []
